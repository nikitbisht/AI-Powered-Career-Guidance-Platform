<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#6366f1" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Compass Circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Cardinal Directions -->
  <text x="100" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="white">N</text>
  <text x="165" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">E</text>
  <text x="100" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="white">S</text>
  <text x="35" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">W</text>
  
  <!-- Compass Cardinal Points (dots) -->
  <circle cx="100" cy="30" r="3" fill="white"/>
  <circle cx="170" cy="100" r="3" fill="white"/>
  <circle cx="100" cy="170" r="3" fill="white"/>
  <circle cx="30" cy="100" r="3" fill="white"/>
  
  <!-- Compass Needle (North - Red) -->
  <polygon points="100,50 95,85 100,80 105,85" fill="#ef4444" stroke="white" stroke-width="1"/>
  
  <!-- Compass Needle (South - Blue) -->
  <polygon points="100,150 95,115 100,120 105,115" fill="#3b82f6" stroke="white" stroke-width="1"/>
  
  <!-- Center Circle -->
  <circle cx="100" cy="100" r="8" fill="white"/>
  <circle cx="100" cy="100" r="5" fill="#6366f1"/>
  
  <!-- Inner Circle Pattern -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  
  <!-- Text Arc for "CareerCompass" -->
  <defs>
    <path id="textPath" d="M 35,100 A 65,65 0 0,1 165,100" fill="none"/>
  </defs>
  <text font-size="11" font-weight="bold" fill="white" letter-spacing="1">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      CAREERCOMPASS AI
    </textPath>
  </text>
</svg>
