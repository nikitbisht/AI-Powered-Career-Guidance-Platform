<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerCompassAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .message { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .message.show { display: block; }
        .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">CareerCompassAI</h1>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">Home</a></li>
                <li><a href="{{ url_for('auth.login') }}" class="nav-link">Log In</a></li>
                <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
            </ul>
        </div>
    </nav>

    <!-- Forgot Password Container -->
    <div class="auth-page">
        <div class="auth-wrapper">
            <div class="auth-card" style="max-width: 500px;">
                <h1>Forgot Password</h1>
                <p class="auth-subtitle">Reset your password with email verification</p>

                <form id="forgotForm" class="auth-form">
                    <!-- Email Section -->
                    <div class="form-section" id="emailSection">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="off">
                            <button type="button" id="sendOtpBtn" class="button-primary">Send OTP</button>
                        </div>
                    </div>

                    <!-- OTP Section -->
                    <div class="form-section" id="otpSection" style="display: none;">
                        <label for="otp" class="form-label">
                            <i class="fas fa-key"></i> Enter 4-Digit OTP
                        </label>
                        <p style="font-size: 12px; color: #999; margin-bottom: 10px;">Check your email for the verification code</p>
                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <input type="text" id="otp" name="otp" maxlength="4" placeholder="0000" required inputmode="numeric">
                            <button type="button" id="verifyOtpBtn" class="button-primary">Verify</button>
                        </div>
                    </div>

                    <!-- Password Reset Section -->
                    <div class="form-section" id="resetSection" style="display: none;">
                        <label for="newPassword" class="form-label">
                            <i class="fas fa-lock"></i> New Password
                        </label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Min. 6 characters" required autocomplete="new-password">
                        <small class="form-help">Must be at least 6 characters</small>

                        <label for="confirmPassword" class="form-label" style="margin-top: 15px;">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">

                        <button type="submit" class="button-primary full-width" style="margin-top: 20px;">
                            <i class="fas fa-check"></i> Reset Password
                        </button>
                    </div>
                </form>

                <!-- Message Display -->
                <div id="message" class="message"></div>

                <p class="auth-footer">
                    <a href="{{ url_for('auth.login') }}">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        const emailField = document.getElementById('email');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpField = document.getElementById('otp');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const newPasswordField = document.getElementById('newPassword');
        const confirmPasswordField = document.getElementById('confirmPassword');
        const forgotForm = document.getElementById('forgotForm');
        const messageDiv = document.getElementById('message');
        const emailSection = document.getElementById('emailSection');
        const otpSection = document.getElementById('otpSection');
        const resetSection = document.getElementById('resetSection');

        let verifiedEmail = '';

        // Clear email field on page load
        window.addEventListener('load', function() {
            setTimeout(() => emailField.value = '', 50);
        });

        // Send OTP
        sendOtpBtn.onclick = async function() {
            const email = emailField.value.trim().toLowerCase();

            if (!email) {
                showMessage('Please enter your email', true);
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email', true);
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            showMessage('Sending OTP...', false);

            try {
                const response = await fetch('/api/auth/send-otp-forgot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email})
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || 'Failed to send OTP', true);
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.innerHTML = 'Send OTP';
                    return;
                }

                showMessage('OTP sent to your email!', false);
                verifiedEmail = email;
                emailField.disabled = true;
                otpSection.style.display = 'block';
                otpField.focus();
                sendOtpBtn.innerHTML = '<i class="fas fa-check"></i> Sent';

            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred', true);
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerHTML = 'Send OTP';
            }
        };

        // Verify OTP
        verifyOtpBtn.onclick = async function() {
            const otp = otpField.value.trim();

            if (!otp || otp.length !== 4) {
                showMessage('Please enter a 4-digit OTP', true);
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            showMessage('Verifying OTP...', false);

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: verifiedEmail, otp})
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || 'Invalid OTP', true);
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.innerHTML = 'Verify';
                    return;
                }

                showMessage('OTP verified! Set your new password.', false);
                emailSection.style.display = 'none';
                otpSection.style.display = 'none';
                resetSection.style.display = 'block';
                
                // Clear password fields and prevent autofill
                newPasswordField.value = '';
                confirmPasswordField.value = '';
                setTimeout(() => {
                    newPasswordField.value = '';
                    confirmPasswordField.value = '';
                    newPasswordField.focus();
                }, 100);

            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred', true);
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.innerHTML = 'Verify';
            }
        };

        // Submit Form - Reset Password
        forgotForm.onsubmit = async function(e) {
            e.preventDefault();

            const newPassword = newPasswordField.value;
            const confirmPassword = confirmPasswordField.value;

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match!', true);
                newPasswordField.value = '';
                confirmPasswordField.value = '';
                return;
            }

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', true);
                return;
            }

            const submitBtn = forgotForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            showMessage('Resetting password...', false);

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: verifiedEmail, password: newPassword})
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || 'Failed to reset password', true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Reset Password';
                    return;
                }

                showMessage('Password reset successfully! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = '{{ url_for("auth.login") }}';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('An error occurred', true);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Reset Password';
            }
        };

        function showMessage(msg, isError) {
            messageDiv.textContent = msg;
            messageDiv.className = 'message show ' + (isError ? 'error' : 'success');
        }
    </script>
</body>
</html>
